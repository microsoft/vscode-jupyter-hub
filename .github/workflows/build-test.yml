on:
  pull_request:
    branches:
      - main
      - 'release'
      - 'release/*'
      - 'release-*'
  check_run:
    types: [rerequested, requested_action]
  push:
    branches:
      - main
      - 'release'
      - 'release/*'
      - 'release-*'
  workflow_dispatch:

env:
  NODE_VERSION: 20.18.2
  NPM_VERSION: 10.8.2
  PYTHON_VERSION: '3.10'

jobs:
  cancel_previous_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@b173b6ec0100793626c2d9e6b90435061f4fc3e5 # 0.11.0
        with:
          access_token: ${{ github.token }}

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
    - name: Use Node ${{env.NODE_VERSION}}
      uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
      with:
       node-version: ${{env.NODE_VERSION}}
    - name: Use Npm ${{env.NPM_VERSION}}
      run: npm i -g npm@${{env.NPM_VERSION}}
    - run: npm i -g @vscode/vsce
    - run: npm ci
    - run: npm run package
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: 'ms-toolsai-jupyter-hub-insiders.vsix'
        path: 'ms-toolsai-jupyter-hub-insiders.vsix'

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
    - name: Use Node ${{env.NODE_VERSION}}
      uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
      with:
       node-version: ${{env.NODE_VERSION}}
    - name: Use Npm ${{env.NPM_VERSION}}
      run: npm i -g npm@${{env.NPM_VERSION}}
    - run: npm ci
    - run: npm run lint

  tests:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
    - name: Use Node ${{env.NODE_VERSION}}
      uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
      with:
       node-version: ${{env.NODE_VERSION}}
    - name: Use Python ${{env.PYTHON_VERSION}}
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      with:
       python-version: ${{env.PYTHON_VERSION}}
    - name: Use Npm ${{env.NPM_VERSION}}
      run: npm i -g npm@${{env.NPM_VERSION}}
    - run: npm i -g @vscode/vsce
    - run: npm ci
    - run: npm run esbuild-base-node
    - run: npm run test-compile
    - run: python -m pip install jupyterhub jupyter-core jupyterlab
    - run: npm i -g configurable-http-proxy
    - run: xvfb-run -a npm test
      if: runner.os == 'Linux'
    # - run: npm test
    #   if: runner.os != 'Linux'

  webtest:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
    - name: Use Node ${{env.NODE_VERSION}}
      uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
      with:
       node-version: ${{env.NODE_VERSION}}
    - name: Use Python ${{env.PYTHON_VERSION}}
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      with:
       python-version: ${{env.PYTHON_VERSION}}
    - name: Use Npm ${{env.NPM_VERSION}}
      run: npm i -g npm@${{env.NPM_VERSION}}
    - run: npm i -g @vscode/vsce
    - run: npm ci
    - run: npx playwright install chromium --with-deps
    - run: npm run esbuild-base-web
    - run: npm run test-compile
    - run: npm run make-extension-pack-for-web-tests
    - run: npm run test-compile-webpack
    - run: python -m pip install jupyterhub jupyter-core jupyterlab
    - run: npm i -g configurable-http-proxy
    - run: xvfb-run -a npm run test:web:ci
      if: runner.os == 'Linux'
    # - run: npm test
    #   if: runner.os != 'Linux'
